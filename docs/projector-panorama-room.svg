<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-label="Projector casting a 360-degree panorama onto the walls of a room">
  <defs>
    <linearGradient id="sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4a90c8"/>
      <stop offset="55%" stop-color="#7eb8d8"/>
      <stop offset="100%" stop-color="#c8d8a8"/>
    </linearGradient>
    <linearGradient id="floor" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2a2f38"/>
      <stop offset="100%" stop-color="#1a1e24"/>
    </linearGradient>
    <linearGradient id="beam" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#ffd966" stop-opacity="0.0"/>
      <stop offset="35%" stop-color="#ffd966" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#ffd966" stop-opacity="0.08"/>
    </linearGradient>
    <linearGradient id="projectorBody" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4a5568"/>
      <stop offset="100%" stop-color="#2d3748"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#8ec8ff"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="960" height="540" fill="#0f1419"/>

  <!-- Title -->
  <text x="480" y="42" text-anchor="middle" fill="#e8edf2" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="22" font-weight="600">Immersive Panorama Projection</text>
  <text x="480" y="66" text-anchor="middle" fill="#8b9aab" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="13">A 360° image is mapped onto the room walls — the viewer stands inside and looks around</text>

  <!-- Room floor (isometric) -->
  <polygon points="180,420 480,520 780,420 480,320" fill="url(#floor)" stroke="#3d4654" stroke-width="1.5"/>

  <!-- Back wall -->
  <polygon points="180,420 180,220 480,170 480,320" fill="#1e2530" stroke="#4a5568" stroke-width="1.5"/>
  <!-- Panorama on back wall -->
  <polygon points="190,410 190,235 470,190 470,315" fill="url(#sky)" opacity="0.95"/>
  <path d="M200,360 Q280,330 360,350 T470,340" fill="none" stroke="#5a8a4a" stroke-width="3" opacity="0.7"/>
  <path d="M210,300 Q300,280 390,295" fill="none" stroke="#6a9a5a" stroke-width="2" opacity="0.5"/>

  <!-- Left wall -->
  <polygon points="180,420 180,220 80,270 80,470" fill="#1a2028" stroke="#4a5568" stroke-width="1.5"/>
  <polygon points="188,412 188,245 95,288 95,455" fill="url(#sky)" opacity="0.85"/>
  <ellipse cx="130" cy="360" rx="28" ry="12" fill="#5a8a4a" opacity="0.45"/>

  <!-- Right wall -->
  <polygon points="780,420 780,220 880,270 880,470" fill="#1a2028" stroke="#4a5568" stroke-width="1.5"/>
  <polygon points="772,412 772,245 865,288 865,455" fill="url(#sky)" opacity="0.85"/>
  <ellipse cx="830" cy="350" rx="30" ry="14" fill="#5a8a4a" opacity="0.45"/>

  <!-- Front wall (partial, cutaway) -->
  <polygon points="480,320 480,170 780,220 780,420" fill="#1e2530" stroke="#4a5568" stroke-width="1.5"/>
  <polygon points="490,315 490,190 770,235 770,410" fill="url(#sky)" opacity="0.95"/>
  <path d="M510,370 Q600,340 690,360 T770,350" fill="none" stroke="#5a8a4a" stroke-width="3" opacity="0.7"/>

  <!-- Unwrapped panorama strip (concept) -->
  <rect x="200" y="88" width="560" height="36" rx="6" fill="#1a2430" stroke="#3d5a80" stroke-width="1"/>
  <rect x="208" y="94" width="544" height="24" rx="4" fill="url(#sky)"/>
  <text x="480" y="112" text-anchor="middle" fill="#d0e4f4" font-family="system-ui, sans-serif" font-size="11" font-weight="500">360° Panorama Image (equirectangular)</text>

  <!-- Mapping arrows from strip to walls -->
  <path d="M280,124 Q250,170 220,230" fill="none" stroke="#8ec8ff" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#arrow)" opacity="0.7"/>
  <path d="M400,124 Q380,170 360,230" fill="none" stroke="#8ec8ff" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#arrow)" opacity="0.7"/>
  <path d="M560,124 Q580,170 600,230" fill="none" stroke="#8ec8ff" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#arrow)" opacity="0.7"/>
  <path d="M680,124 Q710,170 740,230" fill="none" stroke="#8ec8ff" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#arrow)" opacity="0.7"/>

  <!-- Projector light beams -->
  <polygon points="480,430 220,250 240,240 480,400" fill="url(#beam)" opacity="0.5"/>
  <polygon points="480,430 740,250 720,240 480,400" fill="url(#beam)" opacity="0.5"/>
  <polygon points="480,430 480,200 500,200 500,400" fill="url(#beam)" opacity="0.35"/>
  <polygon points="480,430 160,380 170,365 480,400" fill="url(#beam)" opacity="0.3"/>
  <polygon points="480,430 800,380 790,365 480,400" fill="url(#beam)" opacity="0.3"/>

  <!-- Projector -->
  <g filter="url(#glow)">
    <ellipse cx="480" cy="448" rx="34" ry="10" fill="#111820" opacity="0.6"/>
    <rect x="452" y="408" width="56" height="34" rx="4" fill="url(#projectorBody)" stroke="#5a6578" stroke-width="1"/>
    <rect x="458" y="414" width="18" height="12" rx="2" fill="#1a2330" stroke="#6a7588"/>
    <circle cx="510" cy="420" r="7" fill="#ffd966" opacity="0.9"/>
    <circle cx="510" cy="420" r="4" fill="#fff8dc"/>
    <rect x="468" y="442" width="24" height="8" rx="2" fill="#3d4654"/>
  </g>
  <text x="480" y="478" text-anchor="middle" fill="#9aa8b8" font-family="system-ui, sans-serif" font-size="11">Projector</text>

  <!-- Viewer at center -->
  <circle cx="480" cy="385" r="14" fill="none" stroke="#8ec8ff" stroke-width="2" opacity="0.8"/>
  <circle cx="480" cy="385" r="4" fill="#8ec8ff"/>
  <line x1="480" y1="371" x2="480" y2="355" stroke="#8ec8ff" stroke-width="2" stroke-linecap="round"/>
  <line x1="466" y1="385" x2="450" y2="385" stroke="#8ec8ff" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
  <line x1="494" y1="385" x2="510" y2="385" stroke="#8ec8ff" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
  <text x="480" y="340" text-anchor="middle" fill="#8ec8ff" font-family="system-ui, sans-serif" font-size="11" font-weight="500">Viewer (inside cube)</text>

  <!-- Look-around arc -->
  <path d="M430,385 A50,50 0 0 1 530,385" fill="none" stroke="#8ec8ff" stroke-width="1.5" stroke-dasharray="4,3" opacity="0.5"/>
  <text x="555" y="388" fill="#6a8aaa" font-family="system-ui, sans-serif" font-size="10">look around</text>

  <!-- Wall labels -->
  <text x="130" y="210" fill="#7a8a9a" font-family="system-ui, sans-serif" font-size="10" transform="rotate(-18 130 210)">Left wall</text>
  <text x="330" y="155" fill="#7a8a9a" font-family="system-ui, sans-serif" font-size="10">Back wall</text>
  <text x="620" y="155" fill="#7a8a9a" font-family="system-ui, sans-serif" font-size="10">Front wall</text>
  <text x="830" y="210" fill="#7a8a9a" font-family="system-ui, sans-serif" font-size="10" transform="rotate(18 830 210)">Right wall</text>

  <!-- Legend -->
  <rect x="36" y="470" width="220" height="52" rx="8" fill="#161c24" stroke="#2d3748"/>
  <rect x="50" y="486" width="18" height="10" fill="url(#sky)" rx="2"/>
  <text x="76" y="495" fill="#a0aec0" font-family="system-ui, sans-serif" font-size="10">Panorama texture on walls</text>
  <circle cx="59" cy="508" r="4" fill="#ffd966"/>
  <text x="76" y="512" fill="#a0aec0" font-family="system-ui, sans-serif" font-size="10">Projected light</text>
</svg>